repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all -- --check
        pass_filenames: false
        always_run: true
        priority: 0

      - id: cargo-machete
        name: cargo machete
        language: system
        entry: cargo machete
        pass_filenames: false
        always_run: true
        priority: 0

      - id: cargo-clippy
        name: mbx clippy
        language: system
        entry: mbx clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -D warnings
        pass_filenames: false
        always_run: true
        priority: 1

      - id: ast-grep
        name: ast-grep (imperative patterns)
        language: system
        entry: ast-grep scan --error
        pass_filenames: false
        always_run: true
        priority: 0
