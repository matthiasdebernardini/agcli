repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all -- --check
        pass_filenames: false
        always_run: true
        priority: 0

      - id: cargo-machete
        name: cargo machete
        language: system
        entry: cargo machete
        pass_filenames: false
        always_run: true
        priority: 0

      - id: cargo-check
        name: cargo check
        language: system
        entry: cargo check --all-targets
        pass_filenames: false
        always_run: true
        priority: 1

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -D warnings
        pass_filenames: false
        always_run: true
        priority: 1

      - id: ast-grep
        name: ast-grep (imperative patterns)
        language: system
        entry: sg scan
        pass_filenames: false
        always_run: true
        priority: 0
