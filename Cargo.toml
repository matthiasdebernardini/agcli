[package]
name = "agcli"
version = "0.6.0"
edition = "2024"
description = "A tiny, no-bloat foundation crate for building agentic CLIs in Rust."
license = "MIT"
repository = "https://github.com/matthiasdebernardini/agcli"
homepage = "https://github.com/matthiasdebernardini/agcli"
readme = "README.md"
keywords = ["cli", "agent", "json", "framework"]
categories = ["command-line-interface"]

[features]
deserialize = []
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
