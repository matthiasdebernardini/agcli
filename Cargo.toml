[package]
name = "agcli"
version = "0.17.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, no-bloat foundation crate for building agentic CLIs in Rust."
license = "MIT"
repository = "https://github.com/matthiasdebernardini/agcli"
readme = "README.md"
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
keywords = ["cli", "agent", "json", "framework"]
categories = ["command-line-interface"]

[package.metadata.docs.rs]
all-features = true

[features]
deserialize = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "core"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
