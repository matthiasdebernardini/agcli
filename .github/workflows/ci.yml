name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs this same gate before it publishes.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_INCREMENTAL: 0
  AST_GREP_VERSION: 0.51.0
  AST_GREP_SHA256: a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nextest and cargo-machete
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest,cargo-machete

      - name: Install ast-grep
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${AST_GREP_SHA256}  $RUNNER_TEMP/ast-grep.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ast-grep"
          unzip -q "$RUNNER_TEMP/ast-grep.zip" ast-grep -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
      - run: cargo machete
      - run: cargo clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -D warnings
      - run: cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -D warnings
      - run: cargo nextest run --all-features
      - run: cargo test --all-features --doc
      - run: ast-grep scan --error
      - name: No lint suppressions
        run: |
          if grep -rnE '#!?\[(allow|expect)\(|ast-grep-ignore|rustfmt::skip' src tests examples benches; then
            echo "::error::Lint suppressions found; fix the code instead."
            exit 1
          fi
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$MSRV" ]; then
            echo "::error::Cargo.toml has no rust-version"
            exit 1
          fi
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo check --all-targets --all-features
